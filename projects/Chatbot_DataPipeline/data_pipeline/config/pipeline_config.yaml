    #    - /Users/timhazed/tmp/output_20250517_part3/chunked/doc_0036
    docker:
      image: "chunker:latest"
      input_volume: "/Users/timhazed/tmp/output_20250517_unmerged/extracted:/app/input/"
      output_volume: "/Users/timhazed/tmp/output_20250517_unmerged:/app/output"
      env_file: "~/src/python/.env_mini"
      config_path: "/app/config/config.yaml"
  
  insert_db:
