# ETL Pipeline Configuration

tools:
  extractor:
    enabled: false
    # For test if enabled is false, the tool wont run but you can provide extracted_paths for chunker to process
    extracted_paths:
      - /Users/timhazed/tmp/output_20250517_unmerged/extracted/doc_0046
    #   - /Users/timhazed/tmp/output/extracted/doc_0002

    docker:
      image: "extract-normalize:latest"
      input_volume: "/Users/timhazed/tmp/input:/app/input"
      output_volume: "/Users/timhazed/tmp/output_20250517_unmerged:/app/output"
      env_file: "~/src/python/.env_mini"
