[tool.poetry]
name = "newsgenie"
version = "0.1.0"
description = "Multi-agent real-time news assistant powered by LangGraph"
authors = ["Tim Hazed"]
readme = "README.md"
packages = [{include = "src"}, {include = "experiments"}]

[tool.poetry.dependencies]
python = "^3.13"
langchain = "^0.3"
langchain-core = "^0.3"
langchain-openai = "^0.3"
langchain-groq = "^0.2"
langchain-community = "^0.3"
langgraph = "^0.3"
pydantic = "^2.7"
pydantic-settings = "^2.3"
python-dotenv = "^1.0"
httpx = "^0.27"
tenacity = "^9.0"
streamlit = "^1.35"
click = "^8.1"
rich = "^13.7"
python-dateutil = "^2.9"
google-search-results = "^2.4"

[tool.poetry.scripts]
intent-tester = "experiments.intent_tester.intent_tester:main"
news-api-tester = "experiments.news_api_tester.news_api_tester:main"
espn-scorecard-tester = "experiments.espn_scorecard_tester.espn_scorecard_tester:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
respx = "^0.21"
ruff = "^0.5"
ipykernel = "^7.2.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80 -v"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.coverage.report]
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
