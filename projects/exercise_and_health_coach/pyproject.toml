[project]
name = "exercise-and-health-coach"
version = "0.1.0"
description = "Multi-agent exercise and recovery coaching system"
authors = [
    {name = "timhazed", email = "thayes@oldzinsoftware.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "gradio>=5.0",
]

[tool.poetry]
package-mode = true
packages = [{include = "src"}]

[tool.poetry.group.dev.dependencies]
ruff = "^0.8"
ipykernel = "^6.0"

[tool.poetry.group.test.dependencies]
pytest = "^8.0"
pytest-mock = "^3.12"
pytest-cov = "^4.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "-ra",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/cli/*", "src/ui/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
